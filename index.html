<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS | Calculadora de Colores</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        rojo: '#ef4444',
                        verde: '#22c55e',
                        amarillo: '#eab308',
                        azul: '#3b82f6',
                        naranja: '#f97316',
                        blanco: '#ffffff'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden font-sans text-gray-800">

    <!-- Panel de Productos (Izquierda) -->
    <main class="w-2/3 h-full flex flex-col">
        <header class="bg-white shadow-sm px-8 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">
                <i class="fa-solid fa-calculator text-blue-600 mr-2"></i> Terminal de Cobro
            </h1>
            <span class="text-sm font-medium bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Moneda: Libro Pesos (LP)</span>
        </header>

        <div class="p-8 flex-1 overflow-y-auto">
            <h2 class="text-lg font-semibold mb-6 text-gray-600">Catálogo de Colores</h2>
            <div id="grid-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Las tarjetas se inyectan dinámicamente con JS -->
            </div>
        </div>
    </main>

    <!-- Panel de Resumen y Cobro (Derecha) -->
    <aside class="w-1/3 bg-white shadow-xl border-l border-gray-200 flex flex-col h-full relative z-10">
        <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-900 text-white">
            <h2 class="text-xl font-bold">Resumen de Venta</h2>
            <button id="btn-limpiar" class="text-gray-400 hover:text-white transition" title="Limpiar todo">
                <i class="fa-solid fa-trash"></i>
            </button>
        </div>

        <!-- Lista de Ticket -->
        <div id="ticket-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Los items del ticket se inyectan aquí -->
            <div id="empty-state" class="text-center text-gray-400 mt-10">
                <i class="fa-solid fa-cart-shopping text-4xl mb-3"></i>
                <p>No hay artículos seleccionados</p>
            </div>
        </div>

        <!-- Total y Acción -->
        <div class="p-6 bg-gray-50 border-t border-gray-200">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-600 text-lg">Total a Pagar</span>
                <span class="text-4xl font-black text-gray-900"><span id="total-precio">0</span> <span class="text-xl text-gray-500">LP</span></span>
            </div>
            <button id="btn-cobrar" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-lg font-bold py-4 rounded-xl shadow-lg transition transform hover:scale-[1.02] flex justify-center items-center gap-2">
                <i class="fa-solid fa-check"></i> Finalizar Cobro
            </button>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
