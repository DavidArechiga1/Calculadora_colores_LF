<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Colores | Librofest</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Calculadora de Colores<br>LibroFest</h1>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeIcon" title="Cambiar tema">☀️</button>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#ef4444;"></span> Rojo (80 LP)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('rojo', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="rojo">
      <button class="btn-ctrl" onclick="modificarCantidad('rojo', 1)">+</button>
    </div>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#22c55e;"></span> Verde (60 LP)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('verde', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="verde">
      <button class="btn-ctrl" onclick="modificarCantidad('verde', 1)">+</button>
    </div>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#eab308;"></span> Amarillo (40 LP)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('amarillo', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="amarillo">
      <button class="btn-ctrl" onclick="modificarCantidad('amarillo', 1)">+</button>
    </div>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#3b82f6;"></span> Azul (20 LP)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('azul', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="azul">
      <button class="btn-ctrl" onclick="modificarCantidad('azul', 1)">+</button>
    </div>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#f97316;"></span> Naranja (10 LP)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('naranja', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="naranja">
      <button class="btn-ctrl" onclick="modificarCantidad('naranja', 1)">+</button>
    </div>
  </div>

  <div class="color-row">
    <div class="color-info"><span class="badge" style="background:#ffffff; border-color:#d1d5db;"></span> Blanco (Gratis)</div>
    <div class="controls">
      <button class="btn-ctrl" onclick="modificarCantidad('blanco', -1)">-</button>
      <input type="number" min="0" value="0" onchange="calcular()" oninput="calcular()" id="blanco">
      <button class="btn-ctrl" onclick="modificarCantidad('blanco', 1)">+</button>
    </div>
  </div>

  <div class="discount-row">
    <div class="discount-label">
      🏷️ Descuento
    </div>
    <div class="discount-controls">
      <button class="chip-descuento" onclick="aplicarDescuentoRapido(0)">0%</button>
      <button class="chip-descuento" onclick="aplicarDescuentoRapido(10)">10%</button>
      <button class="chip-descuento" onclick="aplicarDescuentoRapido(20)">20%</button>
      <button class="chip-descuento" onclick="aplicarDescuentoRapido(50)">50%</button>
      <div class="discount-input-wrap">
        <input type="number" min="0" max="100" value="0" id="descuento" onchange="calcular()" oninput="calcular()">
        <span class="discount-percent">%</span>
      </div>
    </div>
  </div>

  <div class="total-box">
    <div class="total-subtotal" id="wrap-subtotal">
      Subtotal: <span id="subtotal">0</span> LP &nbsp;•&nbsp; Descuento: <span id="descuento-lp">0</span> LP
    </div>
    <div class="total-final">
      Total: <span id="total">0</span> LP
    </div>
  </div>

  <div class="action-buttons">
    <button class="btn-save" onclick="guardarCalculo()"> ✅ Confirmar y Guardar Venta</button>
    <button class="btn-reset" onclick="reiniciarCalculadora()">🔄 Reiniciar Contador</button>
  </div>
</div>

<div class="container" id="historial-container">
  <div class="history-header-title">
    <h2 style="display: flex; align-items: center; gap: 8px;">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M12 7v5l4 2"/>
      </svg>
      Historial de Ventas
    </h2>
    <div class="history-actions">
      <button class="btn-export-csv" onclick="exportarCSV()" title="Exportar a Excel/CSV">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        CSV
      </button>

      <button class="btn-clear-history" onclick="borrarHistorial()" title="Borrar todo el historial">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  </div>
  <div class="history-list" id="lista-historial"></div>
</div>

<footer>
  <a href="https://www.facebook.com/LibroFestival" target="_blank" rel="noopener noreferrer">Librofest</a> | Todos los derechos reservados
</footer>

<script src="script.js"></script>
</body>
</html>
